<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">PoseCanvas research design and current integration boundary</title>
<desc id="desc">Pose and supplied prop outlines are encoded into adapter feature tokens. The proposed connection to the FLUX backbone is dashed because this integration is not yet implemented. Text and noise feed the base FLUX model, followed by image decoding. A separate training branch uses a skeleton mask for weighted mean squared error.</desc>
